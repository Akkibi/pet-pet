name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn lint
      - run: yarn test
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/pet-pet/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm pack
        working-directory: packages/pet-pet
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: packages/pet-pet
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" packages/pet-pet/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
