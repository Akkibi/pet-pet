    <noscript>
      <h1>pet-pet : un hamster virtuel qui vit sur votre site web</h1>
      <p>pet-pet est une librairie TypeScript gratuite (MIT) et sans dépendance. Un hamster dessiné en Canvas2D se promène sur la page, saute sur les cartes et les boutons, suit le curseur, fait la sieste, mange des graines et réagit aux actions de l'utilisateur. On peut le caresser, le serrer, le lancer : il devient un ragdoll.</p>
      <p>Installation : <code>yarn add pet-pet</code>, puis <code>createPet({ container: document.querySelector('main') })</code>. Un hook React est inclus (<code>pet-pet/react</code>). Cette démo nécessite JavaScript.</p>
